name: Desktop test build

# Builds installers for hand-testing and uploads them as workflow artifacts.
# Nothing is published: no release, no tag, no updater manifest, so the
# in-app updater never sees these builds.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Suffix for the test version, e.g. native-popup.1 -> 0.6.3-native-popup.1"
        required: true
        default: "test.1"
      native_popup_menus:
        description: "Build with native popup menus on (NEXT_PUBLIC_NATIVE_POPUP_MENUS=1)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.runner }}
    env:
      NEXT_PUBLIC_NATIVE_POPUP_MENUS: ${{ inputs.native_popup_menus && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Compute the test version
        id: version
        shell: bash
        run: |
          base="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          echo "value=${base}-${{ inputs.label }}" >> "$GITHUB_OUTPUT"

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      # No updater key here: artifacts for the updater are switched off, and the
      # public key is not embedded, so the build cannot accept an update.
      - name: Build installer
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          npx tauri build ${{ matrix.args }} \
            --config "{\"version\":\"${{ steps.version.outputs.value }}\",\"bundle\":{\"createUpdaterArtifacts\":false}}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: pi-agent-${{ steps.version.outputs.value }}-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
