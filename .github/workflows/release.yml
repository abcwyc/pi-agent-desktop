name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.3

            ### New

            - **Network proxy.** Settings › General › "Network proxy": turn on "Use an HTTP proxy", enter the proxy address and the hosts that skip it, and press "Test connection". Model requests, sign-ins and update checks use it right away, with no restart, so Pi Agent no longer needs your proxy app's TUN mode.
            - **Side chats.** Ask a side question without interrupting the session: type `/side`, use the side-chat button in the composer while a reply is running, or select text and choose "Ask in side chat". Side chats open as tabs in the right panel.
            - **Sidebar.** "Pin" a project, or a session within its project, to the top; "Fork" a session from its row menu; "Delete all sessions… · n" in a project's menu (running sessions are kept). The Projects heading now folds and shows how many projects are active.
            - **Files and right panel.** Drag right-panel tabs to reorder them; CSV/TSV files show as a table; Git changes can be shown as a folder tree; drop files on the file tree to upload them into that folder. On a phone, diffs use one column and the terminal has an extra-keys row.
            - **Models.** Set the context window of a built-in model, override a custom model's Base URL, and reorder a provider's models in models.json (drag, Alt+↑/↓ or A–Z). The model picker names providers by their display name, and the model can be switched while a reply is streaming (from the next request on).

            ### Improved

            - **Merged pi-web 0.15.0.** Prompts sent during a manual compaction wait and are sent after it; a stopped run no longer plays the completion sound or sends a notification; subagents get MCP servers, skills and Code mode.
            - **Chat.** "Quote" puts the selection at the cursor as a Markdown quote; formulas can be copied; audio and video in Markdown play; long code lines wrap by default; extension dialogs widen for code and tables and can be maximized.
            - **Settings on a phone** open one level at a time, with Back.
            - **pi 1.5.1.** Adds Claude Fable 5.2, keeps prompt caches warm between runs when that saves money (cache warming now defaults to "idle"), sends only new messages to Anthropic, stops grep and read from loading whole large files into memory, and fixes several MCP sign-in token refresh problems.
            - The web and PWA icons now use the Pi Agent app icon.

            ### Fixed

            - **Security:** with remote access (Tailscale) or LAN mode on, a request carrying the build's preview id could skip the web password check. The desktop server now strips that header and rotates the preview secrets on every start. Dependencies with known vulnerabilities (Next.js, undici and others) are upgraded.
            - "Full history" export failed for every session; it works again.
            - Download links some models write as `sandbox:/path/file` now open the file.
            - "Check again" on the "Project folder unavailable" banner shows "Checking…", and says "Still unavailable." when nothing changed, instead of looking unresponsive.

            Bundled components: pi 1.5.1, pi-web 0.15.0.

            ---

            ## Pi Agent Desktop 0.8.3

            ### 新增

            - **网络代理。** “设置 › 常规 › 网络代理”：打开“使用 HTTP 代理”，填写代理地址和不走代理的主机，然后点“测试连接”。模型请求、登录和更新检查会立即走这个代理，无需重启，不必再为 Pi Agent 打开代理软件的 TUN 模式。
            - **侧聊。** 不打断当前会话也能另问一个问题：输入 `/side`、在回复进行中点输入框里的侧聊按钮，或选中文字后选择“在侧聊询问”。侧聊以标签页形式在右侧面板打开。
            - **侧栏。** 可以把项目、或项目里的会话“置顶”；会话的行菜单里可以“分叉”；项目菜单里新增“删除全部会话… · n”（运行中的会话会保留）。“项目”标题可以折叠，并显示活跃项目数。
            - **文件与右侧面板。** 右侧面板的标签页可以拖动排序；CSV/TSV 文件以表格显示；Git 改动可以按目录树显示；把文件拖到文件树上即可上传到对应目录。在手机上，差异视图改为单栏，终端多出一排快捷键。
            - **模型。** 可以设置内置模型的上下文窗口、覆盖自定义模型的 Base URL，并在 models.json 中给服务商的模型排序（拖动、Alt+↑/↓ 或 A–Z）。模型选择器按服务商的显示名称列出；回复进行中也能切换模型（从下一次请求开始生效）。

            ### 改进

            - **合入 pi-web 0.15.0。** 手动压缩期间发送的消息会等压缩结束后再发出；手动停止的运行不再播放完成提示音或发送通知；子代理可以使用 MCP 服务器、技能和 Code mode。
            - **对话。** “引用”会把选中文字以 Markdown 引用的形式插入到光标处；公式可以复制；Markdown 中的音频和视频可以播放；长代码行默认自动换行；扩展弹窗会为代码和表格加宽，并可最大化。
            - **手机上的设置**改为逐层进入，可以返回上一级。
            - **pi 1.5.1。** 新增 Claude Fable 5.2；在划算时于两次运行之间保持提示缓存预热（缓存预热默认改为“idle”）；向 Anthropic 只发送新增消息；grep 和 read 不再把整个大文件读入内存；修复多处 MCP 登录令牌刷新问题。
            - 网页和 PWA 图标改为 Pi Agent 应用图标。

            ### 修复

            - **安全：**开启远程访问（Tailscale）或局域网模式时，带有构建预览 ID 的请求可以绕过网页密码校验。桌面服务器现在会去掉这个请求头，并在每次启动时更换预览密钥。同时升级了存在已知漏洞的依赖（Next.js、undici 等）。
            - “完整历史”导出对所有会话都会失败，现已恢复。
            - 部分模型输出的 `sandbox:/路径/文件` 下载链接现在可以打开文件。
            - “项目目录不可用”提示条上的“重新检查”按钮会显示“检查中…”，没有变化时提示“仍无法访问。”，不再像是点不动。

            内置组件版本：pi 1.5.1、pi-web 0.15.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap abcwyc/pi-agent-desktop
  # https://github.com/abcwyc/pi-agent-desktop`) on the release that was just
  # published. Runs only after `manifest` has published it, so a draft or partly
  # failed release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
