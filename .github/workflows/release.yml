name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.5.0

            A release about using more of Pi 1.0 from the desktop: MCP and Code mode now work the way the pi CLI does, extensions behave as they do in the terminal, abandoned branches can carry their work along, and what each model costs and where virtual models route is visible.

            ### Highlights

            - MCP and Code mode: sessions load pi's codemode, tool-search and MCP built-ins like the CLI, so MCP tools are actually callable (the "MCP tools are only reachable from the codemode or tool_search tool" warning is gone). Settings › MCP manages servers without a session: paste-import, per-server exposure, connection test, OAuth sign-in, project servers behind trust, and Code mode Automatic / Always on.
            - Extensions: status text from `ctx.ui.setStatus` shows under the composer again, and extension commands that open, fork or switch sessions (`ctx.newSession`, `ctx.fork`, `ctx.switchSession`) now work instead of silently doing nothing.
            - Branches: rows of other branches offer "Summarize & switch", which carries a summary of the branch you leave (optionally with a focus) and can be stopped; branch summaries render as a card instead of a fake user message.
            - Cost and routing: under a virtual model the composer shows where each reply was routed (`→ model • level`); the session panel lists cost by model that answered and the prompt-cache warming status.
            - Classifier and image models: Settings › Models lists them with sign-in state and prices, and says whether Code mode lets sessions call them; images in tool results (including generated ones) can be saved.
            - Also: a context-usage ring next to the model selector, Open in File Manager in the project menu, "nothing to compact" shown as a notice instead of an error, and Linux fixes (system Node fallback, `PI_DESKTOP_NODE`, single-instance focus, quitting, theme switching, non-recursive file watching).

            Bundled components: pi 1.0.0, pi-web 0.10.0.

            ---

            ## Pi Agent Desktop 0.5.0

            本次版本让桌面端更充分地用上 Pi 1.0：MCP 与 Code mode 的行为与 pi CLI 一致，扩展的表现与终端里一致，离开的分支可以把工作带过来，每个模型的花费和虚拟模型的路由一目了然。

            ### 主要更新

            - MCP 与 Code mode：会话像 CLI 一样加载 pi 内置的 codemode、tool-search 与 MCP，MCP 工具真正可调用（不再出现 "MCP tools are only reachable from the codemode or tool_search tool" 警告）。设置 › MCP 无需打开会话即可管理服务器：粘贴导入、按服务器设置暴露方式、连接测试、OAuth 登录、项目服务器受信任边界保护，以及 Code mode 自动 / 始终开启。
            - 扩展：`ctx.ui.setStatus` 的状态文字重新显示在输入框下方；扩展命令中的新建、分叉、切换会话（`ctx.newSession`、`ctx.fork`、`ctx.switchSession`）现在真正生效，而不是静默无反应。
            - 分支：其他分支的行提供「总结并切换」，把离开的分支总结带到新分支（可指定侧重点，可中途停止）；分支摘要以卡片显示，不再伪装成用户消息。
            - 花费与路由：使用虚拟模型时，输入框旁显示每次回复实际路由到的模型（`→ 模型 • 档位`）；会话面板列出按实际作答模型的花费，以及提示缓存预热状态。
            - 分类与图像模型：设置 › 模型列出这些模型及登录状态和价格，并说明 Code mode 是否允许会话调用；工具结果中的图片（包括生成的图片）可以保存。
            - 其他：模型选择器旁新增上下文用量环；项目菜单支持「在文件管理器中打开」；「无可压缩内容」改为提示而非错误；Linux 修复（回退到系统 Node、`PI_DESKTOP_NODE`、单实例聚焦、退出、主题切换、非递归文件监听）。

            内置组件版本：pi 1.0.0、pi-web 0.10.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          gh release edit "v$version" --draft=false --latest

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi
