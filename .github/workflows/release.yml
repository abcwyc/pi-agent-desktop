name: Publish signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pi-agent-desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            apple_signing_identity: "-"
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
            apple_signing_identity: ""
          # Restored after the file-tracer fix in eacaca3/7f2a1c0: a literal
          # homedir() reaching an fs call made @vercel/nft glob the whole
          # Windows profile at build time, which failed on its junction loops.
          # Verified through desktop:prepare by windows-build-debug.yml before
          # re-enabling; Tauri bundling and signing are first exercised here.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
            apple_signing_identity: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Require updater signing secrets
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY"
          test -n "$UPDATER_PUBLIC_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-updater-public-key.mjs

      # The window controls are drawn by the AppKit the binary links, not the
      # one it runs on: an SDK 15 build shows the legacy traffic lights even on
      # macOS 26+, and with different button geometry (0.7.1 shipped from a
      # macOS 15 runner that way). Fail here instead of shipping that again.
      - name: Require the macOS 26 SDK
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 26

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled component releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run release:manifest
          npm run release:verify

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Test desktop shell
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}

      - name: Build, sign, and upload updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tagName: v__VERSION__
          releaseName: pi-agent-desktop v__VERSION__
          releaseBody: |
            ## Pi Agent Desktop 0.8.1

            ### New

            - **Follow and drive your sessions from a phone.** Settings › General › Remote access sets up access through your own Tailscale network: Pi keeps listening only on this computer, and only the Tailscale accounts you allow can reach it. Turn on **Notify this device** on the phone to get a push when a run finishes, fails, or is waiting for you.
            - **Tasks page.** A new sidebar row lists every session that is waiting for you (with the question it is asking), running (with its current step) or recently finished or failed. Tap a row to open the session.
            - **Project archive.** Right-click a project, or use its "…" menu, and choose "Move to archive" to move it to a folded Archive group at the bottom of the sidebar. Archived sessions stay readable; restore the project before starting new work in it.

            ### Improved

            - **A tidier topbar.** Branches and Full history moved into the `···` More menu, and branch switching is now blocked on desktop while a session runs.
            - **Faster start-up and lower memory.** The session list sends only the first line of each prompt (about 60–75% less data on a cold start), and once more than 4 unused sessions are loaded, the oldest are released.

            ### Fixed

            - A render error now shows the message, stack and a **Copy details** button instead of a blank "This page couldn't load" screen.
            - Credential files such as `~/.ssh` keys and `~/.pi/agent/auth.json` can no longer be opened from the file viewer, even when a session runs in the home folder.
            - Settings, credentials, skills and session files are now rewritten atomically, so a crash mid-write can no longer leave them half-written.

            Bundled components: pi 1.4.0, pi-web 0.10.0.

            ---

            ## Pi Agent Desktop 0.8.1

            ### 新增

            - **在手机上查看和操作会话。** 在“设置 › 通用 › 远程访问”中通过你自己的 Tailscale 网络开启访问：Pi 仍只在本机监听，只有你允许的 Tailscale 账号能连上。在手机上打开“通知这台设备”，运行完成、失败或需要你处理时会收到推送。
            - **任务页面。** 侧栏新增一行，集中显示正在等待你（并显示它的提问）、正在运行（并显示当前步骤）以及最近完成或失败的会话，点按即可打开对应会话。
            - **项目存档。** 右键项目或点它的“…”菜单，选择“移到存档”，项目会移到侧栏底部默认折叠的“存档”分组。存档项目的会话仍可查看；要在其中开始新工作，需先“还原到项目列表”。

            ### 改进

            - **顶栏更简洁。** “分支”和“完整历史”移入 `···` 更多菜单；会话运行期间，桌面端也不能切换分支了。
            - **启动更快、内存更省。** 会话列表只发送每条提示的第一行（冷启动数据量减少约 60–75%）；加载的闲置会话超过 4 个时，会释放最早的那些。

            ### 修复

            - 页面渲染出错时，现在会显示错误信息、调用栈和“Copy details”按钮，而不是空白的“This page couldn't load”页面。
            - 即使会话运行在主目录下，文件查看器也不能再打开 `~/.ssh` 密钥、`~/.pi/agent/auth.json` 等凭据文件。
            - 设置、凭据、技能和会话文件改为原子写入，写到一半崩溃也不会留下损坏的文件。

            内置组件版本：pi 1.4.0、pi-web 0.10.0。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7

      - name: Upload component manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          gh release upload "v$version" src-tauri/resources/component-versions.json --clobber
          # A prerelease is never served by the updater. Say so explicitly
          # instead of relying on the value tauri-action used when it first
          # created the draft (v0.7.3 ended up marked prerelease).
          gh release edit "v$version" --draft=false --latest --prerelease=false

  # A partially failed matrix leaves the release a draft and skips `manifest`,
  # which is correct — but it was also completely silent. Four consecutive
  # v0.1.3 builds failed on Windows without anyone noticing, and the release was
  # published by hand with macOS artifacts only and no component manifest.
  notify:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # This repository currently has Issues disabled, so an issue-only alert
      # silently fails and reports nothing — which is how four consecutive
      # failed releases went unnoticed. The job summary always works; the issue
      # is attempted on top and starts working by itself if Issues are enabled.
      - name: Report the failed release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Signed release build failed"
            echo
            echo "[Run log]($RUN_URL)"
            echo
            echo "The release for this version stays a **draft** and has no"
            echo "\`component-versions.json\`: the manifest job only runs when every"
            echo "platform in the build matrix succeeds."
            echo
            echo "**Do not publish it by hand.** A release missing a platform's installer"
            echo "or its component manifest will not serve updates to that platform —"
            echo "that is exactly how v0.1.3 shipped macOS-only."
          } >> "$GITHUB_STEP_SUMMARY"

          issues_enabled="$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues 2>/dev/null || echo false)"
          if [ "$issues_enabled" != "true" ]; then
            echo "Issues are disabled for $GITHUB_REPOSITORY; reported in the job summary only."
            echo "Enable Issues to also get a persistent, notifying alert." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label release-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Release build failed again: $RUN_URL"
          else
            gh label create release-failure --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "Signed desktop release build needs attention" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Signed release build failed" \
              --label release-failure \
              --body "The signed desktop release build failed: $RUN_URL

          The release for this version stays a DRAFT and has no component-versions.json,
          because the manifest job only runs when every platform in the build matrix
          succeeds. Do not publish it by hand — a release missing a platform's installer
          or its component manifest will not serve updates to that platform.

          This issue is reused for subsequent failures; close it once a release is green."
          fi

  # Keeps Casks/pi-agent.rb (the Homebrew tap: `brew tap abcwyc/pi-agent-desktop
  # https://github.com/abcwyc/pi-agent-desktop`) on the release that was just
  # published. Runs only after `manifest` has published it, so a draft or partly
  # failed release never reaches Homebrew users. Placed after `notify` because
  # release-workflows.test.mjs slices the manifest job up to `notify:`.
  homebrew:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out pi-agent-desktop
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the cask at the published DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/pi-agent-desktop-package.json').version")"
          digest="$(gh release view "v$version" --json assets \
            --jq '.assets[] | select(.name | endswith("_aarch64.dmg")) | .digest')"
          if [ -z "$digest" ]; then
            echo "No aarch64 DMG digest on release v$version" >&2
            exit 1
          fi
          node scripts/update-homebrew-cask.mjs "$version" "$digest"
          if git diff --quiet -- Casks; then
            echo "Cask already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pi-agent.rb
          git commit -m "chore(homebrew): update cask to $version"
          git push origin HEAD:main
